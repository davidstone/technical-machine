name: Build and test

on:
  schedule:
    - cron: '27 10 * * *'
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  compute-matrix:
    uses: davidstone/cmake_strict_defaults/.github/workflows/compute-matrix.yml@main
    with:
      event_name: ${{github.event_name}}

  build:
    needs: compute-matrix
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.compute-matrix.outputs.matrix)}}

    steps:
    - name: Get usage stats
      run: |
        cd ..
        git clone --depth 1 https://github.com/davidstone/pokemon-usage-stats.git
        echo "TM_USAGE_STATS_DIRECTORY=$PWD/pokemon-usage-stats" >> "$GITHUB_ENV"
    - name: Set settings and test directory environment variables
      run: |
        echo "TM_SETTINGS_DIRECTORY=$PWD/settings" >> "$GITHUB_ENV"
        echo "TM_TEST_DIRECTORY=$PWD/test" >> "$GITHUB_ENV"
    - name: Get boost
      run: |
        cd ..
        wget https://archives.boost.io/release/1.87.0/source/boost_1_87_0.tar.bz2
        tar xf boost_1_87_0.tar.bz2
        mkdir -p boost/include
        ln -s $PWD/boost_1_87_0/boost boost/include/boost
    - uses: davidstone/cmake_strict_defaults@main
      with:
        clang_version: ${{matrix.clang_version}}
        dependencies: 'libtbb-dev'
        cmake_args: '-DBoost_INCLUDE_DIR="${{github.workspace}}/../boost/include"'